name: Deploy docs preview

# Fork PR builds have no secrets; this workflow deploys their static artifacts.
# Use trusted default-branch config only, and never execute downloaded artifacts.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Build docs preview"]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      statuses: write
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.path == '.github/workflows/build_docs_preview.yml' }}
    steps:
      - name: "Create commit status"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commitId = context.payload.workflow_run.head_commit.id;
            await github.rest.repos.createCommitStatus({
                context: "docs-preview",
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: commitId,
                state: "pending",
                description: `Creating preview`,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.18.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: dist/docs
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          run-id: "${{ github.event.workflow_run.id }}"
      - name: Validate preview artifact
        shell: bash
        env:
          PREVIEW_DIR: dist/docs
        run: |
          invalid_entry=$(find "$PREVIEW_DIR" ! -type d ! -type f -print -quit)
          if [ -n "$invalid_entry" ]; then
            echo "::error::Preview artifacts must contain only regular files and directories."
            exit 1
          fi
          if [ ! -f "$PREVIEW_DIR/index.html" ]; then
            echo "::error::Preview artifact is missing index.html."
            exit 1
          fi
      - name: Get PR ID
        # https://github.com/orgs/community/discussions/25220#discussioncomment-7532132
        id: pr-id
        run: |
          PR_ID=$(gh run view -R "$GH_REPO" "$WORKFLOW_RUN_ID" | grep -oP "#[0-9]+ . ${WORKFLOW_RUN_ID}" | grep -oP '#[0-9]+' | cut -c 2-)
          echo "pr-id=${PR_ID}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_REPO: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        id: deploy
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT_KEY }}"
          expires: 30d
          channelId: "pr${{ steps.pr-id.outputs.pr-id }}"
          projectId: neuroglancer-demo
          target: docs
      - name: "Update commit status"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_EXPIRE_TIME: ${{ steps.deploy.outputs.expire_time }}
          DEPLOY_DETAILS_URL: ${{ steps.deploy.outputs.details_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const expires = new Date(process.env.DEPLOY_EXPIRE_TIME);
            const commitId = context.payload.workflow_run.head_commit.id;
            await github.rest.repos.createCommitStatus({
                context: "docs-preview",
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: commitId,
                state: "success",
                target_url: process.env.DEPLOY_DETAILS_URL,
                description: `Preview created, expires at: ${expires.toISOString()}`,
            });
